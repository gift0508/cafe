const KEY="ilhaeng2pil_match_v2";const mem={};
const load=()=>{try{return JSON.parse(localStorage.getItem(KEY))||{done:[],wrong:{}}}catch(e){return mem.d||{done:[],wrong:{}}}};
const save=o=>{try{localStorage.setItem(KEY,JSON.stringify(o))}catch(e){mem.d=o}};
let state=load(),cur=0,matched,sel,wrongCount;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function esc(s){return (s+"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function renderDays(){
  const el=document.getElementById("days");

}
function loadDay(){
  matched=new Set();sel=null;wrongCount=0;

  document.getElementById("dayTitle").textContent="Day "+(cur+1);

  const day=DAYS[cur],wmap={};day.forEach(p=>wmap[p.w]=p.s);window._wm=wmap;

  L.innerHTML=shuffle(day).map(p=>`<button class="word" data-w="${esc(p.w)}">${esc(p.w)}</button>`).join("");
  R.innerHTML=shuffle(day).map(p=>`<div class="flip" data-s="${esc(p.s)}"><div class="fi"><div class="ff">${esc(p.s)}</div><div class="fb"><b>${esc(p.k)}</b><small>= ${esc(p.s)}${p.x?", "+esc(p.x):""}</small></div></div></div>`).join("");

function clearSel(){document.querySelectorAll(".word.sel").forEach(x=>x.classList.remove("sel"))}
function clickL(b){if(b.classList.contains("ok"))return;clearSel();sel=b;b.classList.add("sel")}
function clickR(b){
  if(b.classList.contains("flipped"))return;
  if(!sel){b.classList.add("bad");setTimeout(()=>b.classList.remove("bad"),400);return;}

    sel.classList.remove("sel");sel.classList.add("ok");

    wrongCount++;b.classList.add("bad");const s0=sel;s0.classList.add("bad");

  }
}
function updateBar(){const n=matched?matched.size:0,t=DAYS[cur].length;document.getElementById("cnt").textContent=n+"/"+t;document.getElementById("prog").style.width=(n/t*100)+"%"}
function finish(){
  if(!state.done.includes(cur))state.done.push(cur);
