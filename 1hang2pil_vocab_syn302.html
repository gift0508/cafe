<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1행2필 어휘 동의어 엔진 — Day 1~10 (302문항)</title>
<style>
:root{--navy:#16203A;--navy2:#1f2c4e;--gold:#C9A24B;--gold2:#A5761A;--bg:#f4f5f8;--ok:#1e7e4e;--no:#b3372f;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;background:var(--bg);color:#222;padding-bottom:56px;}
header{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:18px 16px 14px;text-align:center;}
header h1{font-size:19px;letter-spacing:.5px;} header h1 b{color:var(--gold);}
header .sub{font-size:12px;color:#c9cede;margin-top:4px;}
.wrap{max-width:640px;margin:0 auto;padding:14px;}
.bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
.bar button{flex:1;min-width:96px;padding:9px 6px;border:1px solid var(--navy);background:#fff;color:var(--navy);border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;}
.bar button.on{background:var(--navy);color:#fff;}
.prog{background:#fff;border-radius:10px;padding:10px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;font-size:13px;box-shadow:0 1px 4px rgba(0,0,0,.07);}
.prog .score{font-weight:800;color:var(--navy);}
.pbar{height:6px;background:#e4e6ee;border-radius:3px;overflow:hidden;margin-bottom:12px;}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold2),var(--gold));width:0;transition:.3s;}
.qcard{background:#fff;border-radius:14px;padding:20px 18px;box-shadow:0 2px 8px rgba(0,0,0,.08);}
.qnum{font-size:12px;color:var(--gold2);font-weight:800;letter-spacing:1px;}
.stem{font-size:34px;font-weight:800;color:var(--navy);margin:8px 0 2px;word-break:break-all;}
.stemMean{font-size:15px;color:var(--gold2);font-weight:700;min-height:22px;margin-bottom:2px;visibility:hidden;}
.stemMean.show{visibility:visible;}
.ask{font-size:13px;color:#666;margin-bottom:16px;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.cardBox{perspective:800px;cursor:pointer;}
.card{position:relative;width:100%;min-height:86px;transition:transform .5s;transform-style:preserve-3d;}
.cardBox.flip .card{transform:rotateY(180deg);}
.face{position:absolute;inset:0;backface-visibility:hidden;border:2px solid #d7dae4;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;background:#fbfbfd;text-align:center;}
.face .num{position:absolute;top:6px;left:10px;font-weight:800;color:var(--gold2);font-size:13px;}
.face .en{font-size:19px;font-weight:800;color:var(--navy);word-break:break-all;}
.back{transform:rotateY(180deg);}
.back .ko{font-size:13.5px;color:#333;margin-top:4px;line-height:1.35;}
.cardBox.sel .front{border-color:var(--navy);background:#eef1f8;}
.cardBox.right .face{border-color:var(--ok);background:#e8f5ee;}
.cardBox.wrong .face{border-color:var(--no);background:#fbeae9;}
.actions{display:flex;gap:8px;margin-top:16px;}
.actions button{flex:1;padding:12px;border:none;border-radius:10px;font-size:15px;font-weight:800;cursor:pointer;}
#btnCheck{background:var(--navy);color:#fff;} #btnNext{background:var(--gold);color:var(--navy);}
button:disabled{opacity:.35;cursor:default;}
.verdict{font-size:15px;font-weight:800;margin-top:12px;min-height:20px;}
.verdict.ok{color:var(--ok);} .verdict.no{color:var(--no);}
.done{background:#fff;border-radius:14px;padding:26px 18px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.08);}
.done .big{font-size:40px;font-weight:900;color:var(--navy);margin:8px 0;}
.done .big small{font-size:18px;color:#888;font-weight:400;}
.done p{font-size:13px;color:#666;margin:4px 0;}
.rv{display:flex;justify-content:space-between;padding:7px 10px;border-radius:8px;font-size:14px;margin-bottom:5px;background:#f6f7fa;}
.rv b{color:var(--navy);} .rv span{color:#444;text-align:right;}
.wronglist{margin-top:16px;text-align:left;max-height:300px;overflow-y:auto;}
.hide{display:none!important;}
footer{position:fixed;bottom:0;left:0;right:0;background:var(--navy);color:#aeb6ce;font-size:11px;text-align:center;padding:7px;}
footer b{color:var(--gold);}
@media(max-width:400px){.stem{font-size:28px}.face .en{font-size:16px}}
</style>
</head>

<header>
<h1><b>1행2필</b> 어휘 동의어 엔진</h1>
<div class="sub">Day 1~10 · 302문항 · 문제도 선지도 영단어 카드 · 정답확인 시 카드가 뒤집혀 한글 공개</div>

</div>
<div class="done hide" id="done">

<div class="big"><span id="finScore"></span><small> / <span id="finTotal"></span></small></div>

<div class="actions">
<button id="btnRetryWrong" style="background:var(--navy);color:#fff" onclick="setMode('wrong')">오답만 다시 풀기</button>
<button style="background:var(--gold);color:var(--navy)" onclick="setMode('all')">처음부터 다시</button>
</div>
<div class="wronglist" id="wronglist"></div>
</div>
</div>
<footer><b>1행2필</b> · Day 1~10 시험지 기반 · 정답=동의어(표준 동의어 포함)</footer>

const KEY = "ilhaeng2pil_vocab_syn_v1";

let sessionRight=0, sessionWrong=0, sessionWrongQs=[];
let state = load();
function load(){ try{ return JSON.parse(localStorage.getItem(KEY))||{wrong:[],pos:0}; }catch(e){ return {wrong:[],pos:0}; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
function resetAll(){ if(!confirm("풀이 기록과 오답을 모두 지웁니다. 계속할까요?"))return; state={wrong:[],pos:0}; save(); setMode("all"); }
function setMode(m){
  if(m==="wrong" && state.wrong.length===0){ alert("저장된 오답이 없습니다."); return; }
  mode=m;
  document.getElementById("mAll").classList.toggle("on", m==="all");
  document.getElementById("mWrong").classList.toggle("on", m==="wrong");
  order = m==="all" ? QUESTIONS.map((_,i)=>i) : state.wrong.slice();
  idx = (m==="all" && state.pos>0 && state.pos<order.length && confirm("이어서 풀까요? ("+(state.pos+1)+"번 문제부터)")) ? state.pos : 0;
  sessionRight=0; sessionWrong=0; sessionWrongQs=[];
  document.getElementById("done").classList.add("hide");
  document.getElementById("qcard").classList.remove("hide");
  render();
}
function render(){
  const q = QUESTIONS[order[idx]];

      +'</div>';

  document.getElementById("btnCheck").disabled=true;
  document.getElementById("btnNext").disabled=true;

function check(){
  if(sel<0||answered)return;

    const i=+cb.dataset.i;
    cb.classList.add("flip");
    if(i===q.ans)cb.classList.add("right");
    else if(i===sel)cb.classList.add("wrong");
  });
  const sm=document.getElementById("stemMean");
  sm.textContent = q.sm; sm.classList.add("show");

    if(!state.wrong.includes(qi)) state.wrong.push(qi); }

  save();
  const v=document.getElementById("verdict");
  v.textContent = right ? "정답! "+q.stem+" ≒ "+q.opts[q.ans].w : "오답 — 정답은 "+(q.ans+1)+"번 "+q.opts[q.ans].w;
  v.className = "verdict "+(right?"ok":"no");
  document.getElementById("btnCheck").disabled=true;
  document.getElementById("btnNext").disabled=false;
  document.getElementById("score").textContent = "정답 "+sessionRight+" · 오답 "+sessionWrong;

function next(){
  if(!answered)return;
  idx++;
  if(idx>=order.length){ finish(); return; }
  render();
}
function finish(){
  if(mode==="all"){ state.pos=0; save(); }
  document.getElementById("qcard").classList.add("hide");
  const d=document.getElementById("done"); d.classList.remove("hide");
  document.getElementById("finScore").textContent=sessionRight;
  document.getElementById("finTotal").textContent=order.length;
  const r=sessionRight/order.length;
  document.getElementById("finMsg").textContent =
    r===1?"전량 정복! 다음 범위로 갑시다.":r>=0.9?"거의 완성 — 오답만 한 번 더.":r>=0.7?"골격은 잡혔습니다. 오답 반복이 답입니다.":"오답 다시 풀기로 바로 재도전하세요.";

    sessionWrongQs.forEach(qi=>{

      const dv=document.createElement("div"); dv.className="rv";
      dv.innerHTML="<b>"+q.stem+" ≒ "+o.w+"</b><span>"+q.sm+"</span>"; wl.appendChild(dv);
    });
  }
}
