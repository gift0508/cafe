const KEY="ilhaeng2pil_quiz_v1";const mem={};
const load=()=>{try{return JSON.parse(localStorage.getItem(KEY))||{done:[],best:{}}}catch(e){return mem.d||{done:[],best:{}}}};
const save=o=>{try{localStorage.setItem(KEY,JSON.stringify(o))}catch(e){mem.d=o}};
let state=load(),cur=0,qi=0,score=0,wrongs=[],answered=false,curOpts=[];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function esc(s){return (s+"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function underline(sent,w){
  const re=new RegExp("\\b("+w+"[a-z]*)\\b","i");
  if(re.test(sent)) return esc(sent).replace(re,"<u><b>$1</b></u>");
  return esc(sent)+' (<b>'+esc(w)+'</b>)';
}
function renderDays(){
  const el=document.getElementById("days");
  el.innerHTML=DAYS.map((_,i)=>`<button data-d="${i}" class="${i===cur?'on':''}">Day ${i+1}${state.done.includes(i)?'<span class="chk">✓</span>':''}</button>`).join("");
  el.querySelectorAll("button").forEach(b=>b.onclick=()=>{cur=+b.dataset.d;startDay()});
}
function startDay(){
  qi=0;score=0;wrongs=[];
  document.getElementById("result").classList.remove("show");
  document.getElementById("qcard").style.display="block";
  document.getElementById("dayTitle").textContent="Day "+(cur+1);
  renderDays();showQ();
}
function showQ(){
  answered=false;
  const it=DAYS[cur][qi];
  document.getElementById("qsent").innerHTML=underline(it.ex,it.w);
  document.getElementById("cnt").textContent=(qi+1)+"/10";
  document.getElementById("prog").style.width=(qi/10*100)+"%";
  // 오답: 반의어(있으면) + 무관(정답·반의어 제외 풀에서)
  const distract=[];
  if(it.anti)distract.push(it.anti);
  const pool=ALLA.filter(a=>a!==it.a&&a!==it.anti);
  distract.push(...shuffle(pool).slice(0,3-distract.length));
  curOpts=shuffle([it.a,...distract]);
  const O=document.getElementById("opts");
  O.innerHTML=curOpts.map((o,i)=>`<button class="opt" data-o="${esc(o)}"><span class="num">${["①","②","③","④"][i]}</span>${esc(o)}</button>`).join("");
  O.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(b,it));
  document.getElementById("expl").classList.remove("show");
  document.getElementById("next").style.display="none";
}
function pick(b,it){
  if(answered)return; answered=true;
  const O=document.getElementById("opts");
  const chosen=b.dataset.o;
  O.querySelectorAll(".opt").forEach(x=>{x.disabled=true;
    if(x.dataset.o===it.a)x.classList.add("ok");
    else if(x.dataset.o===chosen)x.classList.add("bad");});
  if(chosen===it.a)score++; else wrongs.push(it);
  const idx=curOpts.indexOf(it.a);
  const marks=["①","②","③","④"];
  const mark=marks[idx];
  let html='<div class="hd">정답: '+mark+' '+esc(it.a)+'</div>';
  html+='<div class="row" style="margin-bottom:8px"><b style="color:var(--navy)">'+esc(it.w)+'</b> = '+esc(it.k)+'</div>';
  html+=curOpts.map(function(o,i){
    var gl=GLOSS[o]||"";
    var role="";
    if(o===it.a)role=' <b style="color:var(--ok)">← 정답</b>';
    else if(it.anti&&o===it.anti)role=' <span class="anti">← 반의어 함정</span>';
    else role=' <span style="color:var(--muted)">(무관)</span>';
    return '<div class="row">'+marks[i]+' <b>'+esc(o)+'</b> = '+esc(gl)+role+'</div>';
  }).join("");
  const ex=document.getElementById("expl");ex.innerHTML=html;ex.classList.add("show");
  document.getElementById("next").style.display="inline-block";
  document.getElementById("next").textContent=qi<9?"다음 ▶":"결과 보기 ▶";
}
document.getElementById("next").onclick=()=>{ if(qi<9){qi++;showQ();window.scrollTo(0,0);} else finish(); };
function finish(){
  document.getElementById("qcard").style.display="none";
  document.getElementById("prog").style.width="100%";document.getElementById("cnt").textContent="10/10";
  if(!state.done.includes(cur))state.done.push(cur);
  const prev=state.best[cur];state.best[cur]=(prev!==undefined?Math.max(prev,score):score);
  save(state);renderDays();
  document.getElementById("sc").textContent=score;
  document.getElementById("msg").textContent=score===10?"만점! 완벽합니다.":score>=7?"잘했어요. 오답을 확인하세요.":"오답노트를 꼭 복습하세요.";
  const wb=document.getElementById("wrongbox");
  wb.innerHTML=wrongs.length?("<h4>오답노트 ("+wrongs.length+")</h4>"+wrongs.map(x=>`<div class="wrongrow"><b>${esc(x.w)}</b> = ${esc(x.a)} <span class="k">· ${esc(x.k)}</span></div>`).join("")):"<h4 style='color:var(--ok)'>오답 없음 — 완벽합니다!</h4>";
  document.getElementById("nextday").style.display=cur<DAYS.length-1?"inline-block":"none";
  document.getElementById("result").classList.add("show");
}
